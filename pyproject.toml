[project]
name = "apairo-preprocess"
version = "0.1.0"
description = "Preprocessing pipelines for apairo datasets"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "tqdm",
    "cloth-simulation-filter",

    "apairo>=0.6",
    "apairo-transform @ git+https://github.com/apairo-robotics/apairo_transform.git",
]

[project.optional-dependencies]
terraseg = [
    "ptv3 @ git+https://github.com/TedLentsch/TerraSeg.git#subdirectory=ptv3",
    "terraseg @ git+https://github.com/TedLentsch/TerraSeg.git#subdirectory=terraseg_lib",
]
[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
