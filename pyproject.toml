[project]
name = "apairo-preprocess"
version = "0.1.0"
description = "Preprocessing pipelines for apairo datasets"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "tqdm",
    "cloth-simulation-filter",

    "apairo>=0.6",
    "apairo-transform @ git+https://github.com/apairo-robotics/apairo_transform.git",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
